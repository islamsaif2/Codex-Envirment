name: Probe efficient Google Sheets date filtering
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-gviz.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test/gviz-probe.mjs
