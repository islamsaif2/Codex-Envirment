name: Validate live tab navigation
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/smoke-navigation.yml'
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Check tabs after dashboard data finishes loading
        run: node test/live-navigation-smoke.mjs
