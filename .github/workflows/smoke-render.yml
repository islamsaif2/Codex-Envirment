name: Smoke-test live Ultramedix reports
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/smoke-render.yml'
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch real Operations/dashboard data with async polling
        run: node test/live-report-smoke.mjs dashboard
      - name: Fetch real Creative Analysis data with async polling
        run: node test/live-report-smoke.mjs creative
