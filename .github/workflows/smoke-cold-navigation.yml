name: Test cold-loading tab navigation
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/smoke-cold-navigation.yml'
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Verify full Ads load after rapid navigation
        run: node test/live-rapid-navigation-smoke.mjs
