name: Verify Facebook creative fallback and navigation
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/smoke-facebook-fallback.yml'
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Check Facebook embedded media and navigation
        run: node test/live-facebook-fallback-smoke.mjs
