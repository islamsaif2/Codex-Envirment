name: Check Facebook post media fallback
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-facebook-embed.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe canonical Facebook and official oEmbed
        run: node test/facebook-public-post-probe.mjs
